<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- public/favicon.svg, laid out on Apple's macOS icon grid: an 824px body
       centred on the 1024px canvas, leaving room for the Dock's shadow. -->
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0453a"/>
      <stop offset="0.17" stop-color="#c98a4e"/>
      <stop offset="0.34" stop-color="#d8b24a"/>
      <stop offset="0.5" stop-color="#7fa05a"/>
      <stop offset="0.66" stop-color="#4f9a94"/>
      <stop offset="0.83" stop-color="#4a76b0"/>
      <stop offset="1" stop-color="#7a5fa6"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#100f0e"/>
  <rect x="216" y="370" width="592" height="284" rx="142" fill="url(#spectrum)"/>
</svg>
