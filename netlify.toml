# Netlify build config for the Colour Archive public site.
#
# The public site MUST be the read-only static snapshot: PUBLIC_STATIC=true
# hides the server-only chrome (Add/Remove, Inspiration, original-image zoom).
# Pinning it here means every deploy — `npm run deploy:site` or drag-drop —
# produces the same correct build, regardless of any UI settings. On the Mac
# it is built from the app's archive folder (astro.config.mjs, D1).
#
# This is a security boundary, not only a UI one: `publish = "dist/client"`
# ships prerendered HTML/JS/images with no server behind them, so the
# `prerender = false` API routes (upload, remove, label, notes, book, search,
# similar) never run on the public deployment at all — they have no auth of
# their own, and rely entirely on this file never switching to an SSR/functions
# publish target that would put them on the open internet.
#
# The full archive does reach the internet another way, deliberately: from the
# owner's Mac, behind a password (desktop/remote-gate.mjs) and a Tailscale
# Funnel. When that is set up, the build links its Mac-only tabs there via
# PUBLIC_REMOTE_URL (see astro.config.mjs) — links only; nothing here serves it.

[build]
  command = "PUBLIC_STATIC=true astro build"
  publish = "dist/client"

[build.environment]
  PUBLIC_STATIC = "true"

# Scout ships too, and it is nearly all client-side: the sun and moon are
# arithmetic, the terrain and its shadows are decoded in the browser, the frame
# and the line of sight are geometry. It reaches Open-Meteo and Wikimedia
# Commons directly, because both allow it.
#
# Nominatim does not — measured: no access-control-allow-origin under any query
# string — so place search and the dragged pin's name reach it through the
# site's own origin: two proxy rules in public/_redirects, which ship inside
# dist/client so a Drop deploy has them too. The page reads the answer itself
# with the parser the Mac uses (src/lib/scout/view/scout-api.ts →
# src/lib/scout/nominatim.ts) and keeps to Nominatim's one request a second.
#
# There are no functions. Two used to answer `/api/scout/geocode` and
# `/api/scout/reverse`; Netlify's upload refused them from August 2026, and a
# proxy rule needs no upload. Keep it that way: a functions directory makes
# every `netlify deploy` try that upload again.
