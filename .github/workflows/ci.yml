name: CI

# Nothing here was verified anywhere but a developer's Mac until now. The four
# commands are the same ones run by hand before a commit — kept as four separate
# steps so a red run says *which* of the four broke without opening a log.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: `npm test` hands the runner a glob, and glob expansion in
      # `node --test` only arrived in Node 21. Measured on 20.19.5 — "Could not find
      # 'src/**/*.test.ts'", exit 1. Loud, at least, but no tests run.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # First, because it is the cheapest of the four by an order of magnitude:
      # a lint error is worth reporting in seconds rather than after the build.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  # Separate, because it is a different kind of claim and fails for different
  # reasons: it drives a real browser against a real map, and the tiles come
  # from hosts nobody here controls. A red smoke job with a green verify job
  # means "look at the network", not "the code is broken".
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Chromium only. The page is driven through MapLibre and WebGL, and this
      # is not a cross-browser suite — it is a guard on one tab that keeps
      # breaking in ways nothing else here can see.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test /scout
        run: npm run smoke
